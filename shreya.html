<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Dear Friend!</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
      color: white;
      animation: fadeIn 2s ease;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: #fff;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #fff8dc;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 25px;
      color: #fff;
    }

    .btn {
      background: white;
      color: #ff4f81;
      padding: 12px 25px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ff4f81;
      color: white;
      transform: scale(1.05);
    }

    .balloons {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      top: 0;
      left: 0;
      z-index: -1;
    }

    .balloon {
      position: absolute;
      bottom: -150px;
      width: 50px;
      height: 70px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      animation: floatUp 10s infinite ease-in;
    }

    .balloon:nth-child(1) {
      left: 10%;
      background: #ff6b6b;
      animation-duration: 8s;
    }

    .balloon:nth-child(2) {
      left: 30%;
      background: #feca57;
      animation-duration: 10s;
    }

    .balloon:nth-child(3) {
      left: 50%;
      background: #48dbfb;
      animation-duration: 9s;
    }

    .balloon:nth-child(4) {
      left: 70%;
      background: #1dd1a1;
      animation-duration: 11s;
    }

    .balloon:nth-child(5) {
      left: 90%;
      background: #5f27cd;
      animation-duration: 7s;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
      }
      100% {
        transform: translateY(-120vh) rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      h2 {
        font-size: 1.2rem;
      }

      p {
        font-size: 0.95rem;
      }

      .container {
        padding: 25px 15px;
      }
    }
  </style>
</head>
<body>

  <div class="balloons">
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
  </div>

  <div class="container">
    <h1>🎉 Happy Birthday! 🎂</h1>
    <h2>To shreya❤️</h2>
    <p>
      Wishing you endless happiness, laughter, and success on your special day!  
      You are an amazing friend, and I’m so grateful to have you in my life.  
      May your year be filled with love, adventure, and unforgettable memories!
    </p>
    <button class="btn" onclick="startCelebration()">Celebrate 🎊</button>
  </div>

  <script>
    function startCelebration() {
      const duration = 3000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 7,
          angle: 60,
          spread: 55,
          origin: { x: 0 }
        });

        confetti({
          particleCount: 7,
          angle: 120,
          spread: 55,
          origin: { x: 1 }
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }

    // Auto confetti on page load
    window.onload = () => {
      startCelebration();
    };
  </script>

</body>
</html>
